# /etc/nginx/sites-available/everwrap
# Replace everwrap.example.com (four places). Obtain the certificate first without
# letting certbot edit this file:
#   certbot certonly --nginx -d everwrap.example.com

# Per-address rate limit for passphrase attempts (http context; sites-enabled is
# included inside http {}).
limit_req_zone $binary_remote_addr zone=everwrap_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name everwrap.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # No http2 here: `http2 on;` needs nginx >= 1.25.1, and on older versions the
    # listen-level flag would change every site sharing port 443. MCP works over HTTP/1.1.
    server_name everwrap.example.com;

    ssl_certificate /etc/letsencrypt/live/everwrap.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/everwrap.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No access log: URLs carry OAuth request identifiers and the log adds no
    # protection for a single-owner service.
    access_log off;
    # MCP requests and OAuth forms are small; this also bounds registration bodies.
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app trusts X-Real-IP for per-address login limits. Always overwrite it
    # here; the container port is reachable only from this host.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /login {
        limit_req zone=everwrap_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        # Streamable HTTP responses can be server-sent events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
