name: Remote image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: remote-image-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-live.txt pytest
      - run: >-
          python -m pytest -q tests/test_remote.py tests/test_secret_store.py tests/test_evernote_link.py
          tests/test_connect.py tests/test_oauth_refresh.py tests/test_server.py
          tests/test_live.py tests/test_stdio.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: everwrap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with fictional secrets and masking models loaded
        run: |
          set -eu
          work=$(mktemp -d); mkdir -p "$work/config" "$work/data"
          docker run --rm --entrypoint python everwrap:ci -m everwrap.remote generate-key > "$work/key"
          docker run --rm --entrypoint python everwrap:ci -c \
            "from everwrap.remote_auth import hash_passphrase; print(hash_passphrase('ci-only fictional passphrase'))" > "$work/hash"
          echo '{"access_mode":"denylist","content_mode":"redacted","languages":["en","tr"]}' > "$work/config/policy.json"
          docker run --rm --entrypoint python everwrap:ci -c \
            "import torch; assert torch.__version__.endswith('+cpu'), torch.__version__"
          sudo chown -R 10001:10001 "$work"
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 1536m -p 127.0.0.1:8790:8000 \
            -e EVERWRAP_PUBLIC_URL=https://everwrap.example.test \
            -v "$work/data:/data" -v "$work/config:/config:ro" \
            -v "$work/key:/run/secrets/credential_key:ro" \
            -v "$work/hash:/run/secrets/passphrase_hash:ro" everwrap:ci
          for i in $(seq 1 60); do
            [ "$(curl -fsS http://127.0.0.1:8790/healthz || true)" = ok ] && break
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]; then docker logs smoke; exit 1; fi
            sleep 5
          done
          [ "$(curl -fsS http://127.0.0.1:8790/healthz)" = ok ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: everwrap.example.test' \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:8790/mcp)
          [ "$code" = 401 ]
          docker stats --no-stream --format 'Memory after warm-up: {{.MemUsage}}' smoke | tee -a "$GITHUB_STEP_SUMMARY"
          docker image ls everwrap:ci --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker rm -f smoke

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
