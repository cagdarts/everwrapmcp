name: Platform smoke checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-live.txt pytest
      - run: python -m pytest tests/test_connect.py tests/test_oauth_refresh.py tests/test_credentials.py tests/test_server.py tests/test_live.py tests/test_windows_support.py tests/test_stdio.py tests/test_remote.py tests/test_secret_store.py tests/test_evernote_link.py tests/test_notebooks.py -q
